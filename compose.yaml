name: bigdata-taxi

services:
  namenode:
    image: bigdata-taxi-hadoop:3.4.1
    build:
      context: .
      dockerfile: docker/hadoop.Dockerfile
    pull_policy: never
    hostname: namenode
    user: "0:0"
    entrypoint: ["/bin/bash", "/opt/project/hdfs-entrypoint.sh"]
    command: ["namenode"]
    environment:
      HADOOP_HEAPSIZE_MIN: "128"
      HADOOP_HEAPSIZE_MAX: "384"
      HADOOP_ROOT_LOGGER: INFO,console
    volumes:
      - input-staging:/opt/project/data/raw
      - namenode-data:/hadoop/dfs/name
    ports:
      - "127.0.0.1:9870:9870"
    mem_limit: 768m
    cpus: 0.15
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9870"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 30s

  datanode:
    image: bigdata-taxi-hadoop:3.4.1
    build:
      context: .
      dockerfile: docker/hadoop.Dockerfile
    pull_policy: never
    hostname: datanode
    user: "0:0"
    entrypoint: ["/bin/bash", "/opt/project/hdfs-entrypoint.sh"]
    command: ["datanode"]
    environment:
      HADOOP_HEAPSIZE_MIN: "128"
      HADOOP_HEAPSIZE_MAX: "256"
      HADOOP_ROOT_LOGGER: INFO,console
    volumes:
      - datanode-data:/hadoop/dfs/data
    ports:
      - "127.0.0.1:9864:9864"
    depends_on:
      namenode:
        condition: service_healthy
    mem_limit: 640m
    cpus: 0.10
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9864"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 30s

  spark-master:
    image: bigdata-taxi-spark:3.5.8
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    pull_policy: never
    hostname: spark-master
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    environment:
      SPARK_DAEMON_MEMORY: 128m
      HADOOP_CONF_DIR: /opt/hadoop-conf
      PYSPARK_PYTHON: /usr/bin/python3
    volumes:
      - spark-logs:/opt/project/logs
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:4040:4040"
    mem_limit: 2g
    cpus: 0.75
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 30s

  spark-worker:
    image: bigdata-taxi-spark:3.5.8
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    pull_policy: never
    hostname: spark-worker
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.worker.Worker", "--host", "spark-worker", "--port", "7081", "--webui-port", "8081", "--cores", "1", "--memory", "1g", "spark://spark-master:7077"]
    environment:
      SPARK_DAEMON_MEMORY: 128m
      SPARK_WORKER_DIR: /tmp/spark-work
      SPARK_LOCAL_DIRS: /tmp/spark-local
      HADOOP_CONF_DIR: /opt/hadoop-conf
      PYSPARK_PYTHON: /usr/bin/python3
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      spark-master:
        condition: service_healthy
      datanode:
        condition: service_healthy
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  namenode-data:
  datanode-data:
  input-staging:
  spark-logs:
